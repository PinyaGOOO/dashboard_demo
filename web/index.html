<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#15191f">
  <meta name="description" content="Центр управления стендами демонстрационного экзамена">
  <title>DemoOps — управление стендами</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#app">Перейти к содержимому</a>

  <svg class="svg-sprite" aria-hidden="true" width="0" height="0">
    <symbol id="icon-grid" viewBox="0 0 24 24">
      <rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/>
      <rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>
    </symbol>
    <symbol id="icon-server" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/>
      <path d="M7 7h.01M7 17h.01M11 7h7M11 17h7"/>
    </symbol>
    <symbol id="icon-code" viewBox="0 0 24 24">
      <path d="m8 9-4 3 4 3M16 9l4 3-4 3M14 5l-4 14"/>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <path d="M20 6 9 17l-5-5"/><path d="M21 12a9 9 0 1 1-5.3-8.2"/>
    </symbol>
    <symbol id="icon-users" viewBox="0 0 24 24">
      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
      <path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>
    </symbol>
    <symbol id="icon-activity" viewBox="0 0 24 24">
      <path d="M3 12h4l3-9 4 18 3-9h4"/>
    </symbol>
    <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="icon-x" viewBox="0 0 24 24"><path d="m18 6-12 12M6 6l12 12"/></symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24">
      <path d="M20 7h-5V2M4 17h5v5"/><path d="M19 12a7 7 0 0 0-12-5L4 10M5 12a7 7 0 0 0 12 5l3-3"/>
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-bell" viewBox="0 0 24 24">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>
    </symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
    <symbol id="icon-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="icon-power" viewBox="0 0 24 24"><path d="M18.4 6.6a9 9 0 1 1-12.8 0M12 2v10"/></symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 15H6L5 6M10 11v5M14 11v5"/></symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M15 9V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h4"/></symbol>
    <symbol id="icon-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/></symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="icon-external" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
    <symbol id="icon-alert" viewBox="0 0 24 24"><path d="M10.3 3.6 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.6a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></symbol>
    <symbol id="icon-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
    <symbol id="icon-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="icon-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
  </svg>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Основная навигация">
      <div class="sidebar__header">
        <a class="brand" href="#overview" data-route="overview" aria-label="DemoOps — на главную">
          <span class="brand__mark" aria-hidden="true">
            <span class="brand__node"></span><span class="brand__node"></span><span class="brand__node"></span>
          </span>
          <span class="brand__wordmark"><strong>Demo</strong><span>Ops</span></span>
        </a>
        <button class="icon-button sidebar__close" id="sidebar-close" type="button" aria-label="Закрыть меню">
          <svg><use href="#icon-x"></use></svg>
        </button>
      </div>

      <div class="sidebar__context">
        <span class="context-label">Рабочая область</span>
        <button class="context-switcher" type="button" aria-label="Текущий кластер">
          <span class="context-icon"><svg><use href="#icon-server"></use></svg></span>
          <span class="context-copy"><strong>Демоэкзамен</strong><small>Proxmox Cluster</small></span>
          <svg class="context-arrow"><use href="#icon-chevron"></use></svg>
        </button>
      </div>

      <nav class="sidebar__nav" aria-label="Разделы панели">
        <p class="nav-caption">Управление</p>
        <a class="nav-link is-active" href="#overview" data-route="overview" aria-current="page">
          <svg><use href="#icon-grid"></use></svg><span>Обзор</span>
        </a>
        <a class="nav-link" href="#stands" data-route="stands">
          <svg><use href="#icon-server"></use></svg><span>Стенды</span><span class="nav-badge" id="nav-stands-count" hidden></span>
        </a>
        <a class="nav-link" href="#blueprints" data-route="blueprints">
          <svg><use href="#icon-code"></use></svg><span>Сценарии</span>
        </a>
        <a class="nav-link" href="#checks" data-route="checks">
          <svg><use href="#icon-check"></use></svg><span>Автопроверки</span>
        </a>

        <p class="nav-caption">Наблюдение</p>
        <a class="nav-link" href="#infrastructure" data-route="infrastructure">
          <svg><use href="#icon-activity"></use></svg><span>Инфраструктура</span>
        </a>
      </nav>

      <div class="sidebar__footer">
        <div class="cluster-state" id="cluster-state">
          <span class="cluster-state__dot" aria-hidden="true"></span>
          <span><strong>Proxmox подключён</strong><small>Системы работают штатно</small></span>
        </div>
        <div class="sidebar__meta"><span>DemoOps</span><span>v1.0</span></div>
      </div>
    </aside>

    <button class="sidebar-scrim" id="sidebar-scrim" type="button" tabindex="-1" aria-label="Закрыть меню"></button>

    <div class="workspace">
      <header class="topbar">
        <div class="topbar__heading">
          <button class="icon-button topbar__menu" id="sidebar-toggle" type="button" aria-label="Открыть меню" aria-controls="sidebar" aria-expanded="false">
            <svg><use href="#icon-menu"></use></svg>
          </button>
          <div>
            <p class="eyebrow" id="page-eyebrow">Центр управления</p>
            <h1 id="page-title">Обзор</h1>
          </div>
        </div>

        <div class="topbar__actions">
          <div class="sync-state" id="sync-state" title="Состояние синхронизации">
            <span class="sync-state__dot"></span>
            <span class="sync-state__copy">Данные актуальны</span>
          </div>
          <button class="icon-button" id="global-refresh" type="button" aria-label="Обновить данные" title="Обновить данные">
            <svg><use href="#icon-refresh"></use></svg>
          </button>
          <button class="icon-button notification-button" id="notifications-button" type="button" aria-label="Уведомления" title="Уведомления">
            <svg><use href="#icon-bell"></use></svg>
            <span class="notification-dot" hidden></span>
          </button>
          <button class="button button--primary topbar__create" id="quick-create" type="button">
            <svg><use href="#icon-plus"></use></svg><span>Развернуть стенд</span>
          </button>
          <button class="operator" id="operator-settings" type="button" title="Настроить административный токен">
            <span class="operator__avatar">АД</span>
            <span class="operator__copy"><strong>Администратор</strong><small>Полный доступ</small></span>
          </button>
        </div>
      </header>

      <main class="main-content" id="app" tabindex="-1" aria-live="polite">
        <div class="page-loading" role="status" aria-label="Загрузка данных">
          <div class="loading-heading">
            <span class="skeleton skeleton--title"></span>
            <span class="skeleton skeleton--button"></span>
          </div>
          <div class="loading-grid">
            <span class="skeleton skeleton--card"></span><span class="skeleton skeleton--card"></span>
            <span class="skeleton skeleton--card"></span><span class="skeleton skeleton--card"></span>
          </div>
          <span class="skeleton skeleton--panel"></span>
        </div>
      </main>
    </div>
  </div>

  <div id="modal-root" class="modal-root" aria-live="polite"></div>
  <div id="toast-root" class="toast-root" role="region" aria-label="Уведомления" aria-live="polite"></div>
  <noscript>
    <div class="noscript-message">Для работы панели управления необходимо включить JavaScript.</div>
  </noscript>
</body>
</html>
